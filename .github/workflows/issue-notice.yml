name: Auto reply to new issues and PRs

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Post notice
        uses: actions/github-script@v7
        with:
          script: |
            const repoUrl = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo;
            const isIssue = context.eventName === 'issues';
            const lines = [
              '感谢提交！这是一个**个人自用**的小项目，全程由 AI 开发，作者利用业余时间维护，',
              '因此响应和评审可能不及时，也不承诺采纳所有建议。',
              '',
              '几点说明：',
              '- 请确认已阅读 [README](' + repoUrl + '/blob/main/README.md) 和 [配置与凭据获取说明](' + repoUrl + '/blob/main/docs/配置与凭据获取说明.md)。',
              '- 请确保内容中**不含**真实域名、IP、Token、密码、密钥或账号文件。',
              isIssue
                ? '- 如果是部署问题，多数情况属于环境差异；请先核对容器内路径与实际挂载源。'
                : '- 提交 PR 前请阅读 [CONTRIBUTING.md](' + repoUrl + '/blob/main/CONTRIBUTING.md)，并确认未包含凭据。',
              '',
              '如果是误报或不需要处理，直接关闭即可。谢谢理解。'
            ];
            const body = lines.join('\n');
            const number = isIssue
              ? context.issue.number
              : context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body
            });
