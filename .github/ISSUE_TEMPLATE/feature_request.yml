name: 功能建议 / Feature request
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > 本项目是作者自用的个人工具，功能取舍以作者自己的 NAS 环境为准，未必适合所有场景。
        > 建议会被认真阅读，但不保证采纳或排期。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，确认没有重复建议
          required: true
        - label: 我理解这是个人项目，维护者不承诺实现时间
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述实际场景和痛点，而不只是"想要某个功能"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 可选
    validations:
      required: false
  - type: dropdown
    id: willing
    attributes:
      label: 是否愿意自己提交 PR
      options:
        - 愿意，我可以尝试实现
        - 可以，但需要指导
        - 暂时不方便
    validations:
      required: true
